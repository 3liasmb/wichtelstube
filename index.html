</style></head><body><header><div class="inner"><div><strong>🎄 Die Wichtelstube</strong><small>Das Glücksrad für deine Klasse</small></div><span class="tag" id="headerInfo">Offline & lokal</span></div></header><main id="app"></main><div class="footnav" id="nav"></div><div id="toast" role="status"></div><div id="modalBackdrop" role="presentation"><div id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Die Wichtelstube</h2><p id="modalMessage"></p><div class="passwordField"><input id="modalInput" class="hidden" autocomplete="off"><button type="button" id="passwordPeek" class="outline hidden" aria-label="Passwort anzeigen" aria-pressed="false">👁 Anzeigen</button></div><div id="modalActions"><button id="modalCancel" class="secondary" type="button">Abbrechen</button><button id="modalOK" type="button">Bestätigen</button></div></div></div><section id="printArea" class="printonly"></section><script>
'use strict';
const KEY='wichtelstube_schule_v1';let db,screen='home',activeId=null,turnId=null,angle=0,spinning=false,showSecret=false,printMode='';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const blank=()=>({teacher:'',classes:[]});
db=blank();
let changed=false, verifiedBackup=false;
function save(){changed=true;verifiedBackup=false;updateUnsaved()}
function updateUnsaved(){const h=$('headerInfo');if(h)h.title=changed?'Ungesicherte Änderungen – bitte Sicherung herunterladen':'Keine ungesicherten Änderungen'}
function uiDialog(message,kind='confirm',defaultValue=''){
 return new Promise(resolve=>{const bg=$('modalBackdrop'),inp=$('modalInput'),ok=$('modalOK'),cancel=$('modalCancel');$('modalMessage').textContent=message;inp.classList.toggle('hidden',kind==='confirm');inp.type=/passwort/i.test(message)?'password':'text';inp.value=defaultValue??'';const peek=$('passwordPeek');peek.classList.toggle('hidden',inp.type!=='password'||kind==='confirm');peek.textContent='👁 Anzeigen';peek.setAttribute('aria-pressed','false');peek.onclick=()=>{const visible=inp.type==='text';inp.type=visible?'password':'text';peek.textContent=visible?'👁 Anzeigen':'🙈 Verbergen';peek.setAttribute('aria-pressed',String(!visible));inp.focus()};ok.textContent=kind==='confirm'?'Ja, fortfahren':'Übernehmen';bg.classList.add('active');function done(v){bg.classList.remove('active');ok.onclick=null;cancel.onclick=null;inp.onkeydown=null;$('passwordPeek').onclick=null;inp.value='';resolve(v)}ok.onclick=()=>done(kind==='confirm'?true:inp.value);cancel.onclick=()=>done(kind==='confirm'?false:null);inp.onkeydown=e=>{if(e.key==='Enter')ok.click()};setTimeout(()=>kind==='confirm'?ok.focus():inp.focus(),30)})}
const uiConfirm=message=>uiDialog(message,'confirm');
const uiPrompt=(message,value='')=>uiDialog(message,'prompt',value);
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function current(){return db.classes.find(c=>c.id===activeId)}
function participants(c){return [...c.students.map(s=>({id:s.id,name:s.name,teacher:false})),...(c.teacherJoins?[{id:'teacher',name:db.teacher,teacher:true}]:[])]}
function navTo(s){if(spinning)return;screen=s;showSecret=false;render();window.scrollTo(0,0)}
function layout(title,sub,content,steps=''){return `<div class="eyebrow">${esc(steps)}</div><h1>${esc(title)}</h1><p class="sub">${sub}</p>${content}`}
function render(){const c=current();$('headerInfo').textContent=db.teacher||'Offline & lokal';let html='';if(screen==='home')html=home();if(screen==='class')html=classEdit(c);if(screen==='wheel')html=wheelPage(c);if(screen==='protocol')html=protocol(c);if(screen==='rules')html=rulesPage(c);$('app').innerHTML=html;let nav='';if(screen!=='home')nav+=`<button class="secondary" onclick="navTo('home')">🏠 Klassen</button>`;if(c&&screen!=='class')nav+=`<button class="secondary" onclick="navTo('class')">✏️ Vorbereitung</button>`;if(c&&screen!=='protocol')nav+=`<button onclick="navTo('protocol')">🔒 Lehrerprotokoll</button>`;$('nav').innerHTML=nav;if(screen==='wheel'&&c)requestAnimationFrame(()=>drawWheel(c));}
function home(){return layout('Willkommen in der Wichtelstube!', 'Lege dein Lehrerprofil an und verwalte mehrere Klassen. Keine Cloud, kein Benutzerkonto. Sichere deine Arbeit bei Bedarf als verschlüsselte Datei.',`<div class="card"><h2>👩‍🏫 Mein Lehrerprofil</h2><label for="teacher">Name der Lehrkraft</label><input id="teacher" value="${esc(db.teacher)}" placeholder="z. B. Frau Schmidt" maxlength="80"><div class="row" style="margin-top:12px"><button onclick="setTeacher()">Profil speichern</button><button class="outline" onclick="exportBackup()">Sicherung herunterladen</button><button class="outline" onclick="$('import').click()">Sicherung laden</button><input id="import" type="file" accept=".wichtel,application/octet-stream,.json,application/json" class="hidden" onchange="importBackup(this)"></div></div><div class="card"><h2>📚 Meine Klassen</h2><div class="stack">${db.classes.length?db.classes.map(c=>`<div class="item"><div><strong>${esc(c.name)}</strong><small>${c.students.length} Schüler · ${c.assignments?'Auslosung gestartet':'In Vorbereitung'}</small></div><div class="row"><button class="tiny" onclick="openClass('${c.id}')">Öffnen</button><button class="tiny danger" onclick="deleteClass('${c.id}')">Löschen</button></div></div>`).join(''):'<p class="sub">Noch keine Klasse angelegt.</p>'}</div><hr class="divider"><label for="newclass">Neue Klasse hinzufügen</label><div class="row"><input id="newclass" style="flex:1;min-width:160px" placeholder="z. B. 5a" maxlength="60"><button onclick="addClass()">+ Klasse anlegen</button></div></div><div class="notice">🔐 Die Daten bleiben nur während dieser Sitzung geöffnet. Bitte eine verschlüsselte Sicherung herunterladen und prüfen, bevor du die Sitzung beendest.</div>`,'1 · Profil und Klassen')}
function setTeacher(){const n=$('teacher').value.trim();if(!n)return toast('Bitte zuerst deinen Namen eingeben.');if(db.classes.some(c=>c.assignments&&c.teacherJoins&&db.teacher!==n))return toast('Lehrername kann nach einer Auslosung mit Lehrkraft nicht geändert werden.');db.teacher=n;save();toast('Profil gespeichert');render()}
function addClass(){const name=$('newclass').value.trim();if(!db.teacher.trim())return toast('Bitte zuerst das Lehrerprofil speichern.');if(!name)return toast('Bitte Klassennamen eingeben.');if(db.classes.some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast('Diese Klasse existiert bereits.');let c={id:uid(),name,year:schoolYear(),history:[],students:[],teacherJoins:false,budget:'10',deadline:'',handover:'Bei der Lehrkraft abgeben',extra:'',assignments:null,drawn:[]};db.classes.push(c);save();activeId=c.id;navTo('class')}
function openClass(id){activeId=id;turnId=null;navTo('class')}
async function deleteClass(id){let c=db.classes.find(c=>c.id===id);if(!await uiConfirm(`Klasse „${c.name}“ samt aller Ziehungen unwiderruflich löschen?`))return;db.classes=db.classes.filter(x=>x.id!==id);if(activeId===id)activeId=null;save();render()}
function classEdit(c){if(!c)return home();let locked=!!c.assignments;return layout(`${c.name} · Vorbereitung`,'Schüler eintragen, Regeln festlegen und entscheiden, ob die Lehrkraft mitwichtelt.',`<div class="card"><h2>1. Wer wichtelt mit?</h2><label for="names">Schülernamen – einen Namen pro Zeile</label><textarea id="names" style="min-height:170px" ${locked?'disabled':''} placeholder="Emma\nNoah\nLina">${esc(c.students.map(s=>s.name).join('\n'))}</textarea><p class="sub">Die Reihenfolge der Namen bestimmt, wer als Nächstes an der Reihe ist – nicht, wen jemand gezogen hat.</p><label class="row" style="font-size:16px"><input type="checkbox" id="joins" ${c.teacherJoins?'checked':''} ${locked?'disabled':''}> 👩‍🏫 Lehrkraft wichtelt mit (${esc(db.teacher)})</label><div class="row" style="margin-top:13px"><button ${locked?'disabled':''} onclick="saveStudents()">Teilnehmer übernehmen</button><span class="tag">${participants(c).length} Teilnehmer</span></div>${locked?'<p class="notice">Die Auslosung läuft bereits. Änderungen an den Teilnehmern erfordern einen Neustart der Runde.</p>':''}</div><div class="card"><h2>2. Regeln & Abgabe</h2><div class="grid"><div><label for="budget">Geschenkbudget (Euro)</label><input id="budget" value="${esc(c.budget)}" placeholder="10"></div><div><label for="deadline">Abgabetermin</label><input id="deadline" type="date" value="${esc(c.deadline)}"></div></div><div style="margin-top:12px"><label for="handover">Wo wird das Geschenk abgegeben?</label><input id="handover" value="${esc(c.handover)}" placeholder="z. B. im Klassenzimmer bei Frau Schmidt"></div><div style="margin-top:12px"><label for="extra">Weitere Hinweise (optional)</label><textarea id="extra" placeholder="z. B. Bitte keine Lebensmittel mit Nüssen">${esc(c.extra)}</textarea></div><div class="row"><button onclick="saveRules()">Regeln speichern</button><button class="outline" onclick="saveRules();navTo('rules')">Wichtelverträge ansehen & drucken</button></div></div><div class="card"><h2>3. Wichtelrunde</h2><p class="sub">Jeder beschenkt genau eine andere Person und wird genau einmal beschenkt – auch bei ungerader Teilnehmerzahl.</p><div class="row"><button class="gold" onclick="startRound()">${locked?'🎡 Zur Schüleransicht':'🎡 Glücksrad starten'}</button><button class="outline" onclick="navTo('protocol')">Lehrerprotokoll</button>${locked?'<button class="danger" onclick="resetRound()">Runde neu auslosen</button>':''}</div></div>`,'2 · Klasse vorbereiten')}
function saveStudents(){let c=current();if(c.assignments)return;const names=$('names').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(new Set(names.map(n=>n.toLocaleLowerCase('de'))).size!==names.length)return toast('Bitte doppelte Schülernamen unterscheiden (z. B. mit Nachname).');if(names.some(n=>n.length>90))return toast('Ein Name ist zu lang.');if($('joins').checked&&names.some(n=>n.toLocaleLowerCase('de')===db.teacher.toLocaleLowerCase('de')))return toast('Lehrkraft steht bereits in der Schülerliste.');c.students=names.map((name,i)=>({id:c.students[i]?.name===name?c.students[i].id:uid(),name}));c.teacherJoins=$('joins').checked;save();toast('Teilnehmer gespeichert');render()}
function saveRules(){const c=current();c.budget=$('budget').value.trim();c.deadline=$('deadline').value;c.handover=$('handover').value.trim();c.extra=$('extra').value.trim();save();toast('Regeln gespeichert')}
function randomInt(max){if(window.crypto?.getRandomValues){const a=new Uint32Array(1);const lim=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%max}return Math.floor(Math.random()*max)}
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=randomInt(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function createAssignments(ps){ // randomized single cycle: guarantees exactly one recipient and no self, even with odd counts
let ids=shuffle(ps.map(p=>p.id));let result={};ids.forEach((id,i)=>result[id]=ids[(i+1)%ids.length]);return result}
async function startRound(){const c=current();if(!c.assignments){let ps=participants(c);if(ps.length<2)return toast('Mindestens zwei Teilnehmer erforderlich.');if(!await uiConfirm(`Auslosung für ${ps.length} Teilnehmer starten? Danach sind die Namen gesperrt.`))return;c.assignments=createAssignments(ps);c.drawn=[];save()}turnId=null;navTo('wheel')}
async function resetRound(){const c=current();if(!await uiConfirm('Alle bisherigen Zuordnungen und Ziehungen dieser Klasse löschen und neu starten?'))return;c.assignments=null;c.drawn=[];turnId=null;save();navTo('class')}
function wheelPage(c){if(!c?.assignments)return layout('Noch keine Auslosung','Bitte zuerst die Teilnehmer vorbereiten.',`<button onclick="navTo('class')">Zur Vorbereitung</button>`);let ps=participants(c),remaining=ps.filter(p=>!c.drawn.includes(p.id));if(!turnId||!remaining.some(p=>p.id===turnId))turnId=remaining[0]?.id||null;let p=ps.find(x=>x.id===turnId);return layout(`${c.name} · Glücksrad`,'Die Lehrkraft ruft die Teilnehmenden in der Listenreihenfolge auf. Jede Person dreht selbst.',`<div class="card center"><span class="tag">${c.drawn.length} von ${ps.length} gezogen</span>${remaining.length?`<h2 style="margin-top:14px">🎅 Jetzt ist dran: ${esc(p.name)}</h2><div class="row" style="justify-content:center"><label for="turn" style="margin:0">Wer kommt nach vorne?</label><select id="turn" style="max-width:230px" onchange="changeTurn(this.value)">${remaining.map(q=>`<option value="${esc(q.id)}" ${q.id===turnId?'selected':''}>${esc(q.name)}</option>`).join('')}</select></div><p class="sub">Der eigene Name erscheint nicht auf dem Rad.</p><div class="wheelbox" id="wheelbox"><div class="pointer"></div><canvas id="wheel" width="800" height="800" aria-label="Wichtelglücksrad"></canvas></div><div id="result" class="${showSecret?'':'hidden'} reveal"><p>Du beschenkst dieses Jahr:</p><div class="big" id="winner"></div><p class="sub">Pssst! Behalte es für dich.</p><div class="row" style="justify-content:center"><button class="secondary" onclick="finishTurn()">Ergebnis verbergen · Weiter</button></div></div><button id="spin" class="gold full" style="font-size:19px" onclick="spinWheel()">🎡 Glücksrad drehen</button>`:`<h2 style="margin-top:20px">🎉 Alle haben gezogen!</h2><p>Die Runde ist abgeschlossen. Das Lehrerprotokoll steht bereit.</p><button onclick="navTo('protocol')">Lehrerprotokoll öffnen</button>`}</div><div class="notice">👀 Die Lehrkraft sollte den Bildschirm beaufsichtigen. Nach jeder Ziehung das Ergebnis verbergen, bevor die nächste Person nach vorne kommt.</div>`,'3 · Schüler ziehen')}

const colors=['#275947','#e8bd70','#b64b46','#f3dfb4','#4b8066','#d58a69'];
function drawWheel(c,rot=angle){let canvas=$('wheel');if(!canvas)return;let ctx=canvas.getContext('2d');let ps=participants(c).filter(p=>p.id!==turnId);let n=ps.length;ctx.clearRect(0,0,800,800);if(!n)return;let cx=400,cy=400,r=380;ps.forEach((p,i)=>{let start=rot+i*2*Math.PI/n-Math.PI/2,end=start+2*Math.PI/n;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff7e9';ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(start+Math.PI/n);ctx.fillStyle=i%6===0||i%6===2||i%6===4?'#fff':'#26362e';ctx.textAlign='right';ctx.font=`bold ${Math.max(18,Math.min(30,170/n+13))}px system-ui`;let label=p.name.length>22?p.name.slice(0,21)+'…':p.name;ctx.fillText(label,r-25,9,Math.min(270,r-95));ctx.restore()});ctx.beginPath();ctx.arc(cx,cy,38,0,2*Math.PI);ctx.fillStyle='#fffaf0';ctx.fill();ctx.strokeStyle='#b18d51';ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#183d32';ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('✦',cx,cy+11)}
function spinWheel(){let c=current();if(!c||!turnId||spinning)return;let ps=participants(c).filter(p=>p.id!==turnId),winner=c.assignments[turnId],idx=ps.findIndex(p=>p.id===winner);if(idx<0)return toast('Auslosungsfehler. Bitte Sicherung prüfen.');spinning=true;$('spin').disabled=true;$('turn').disabled=true;let n=ps.length,step=2*Math.PI/n;let target=-((idx+.5)*step);let base=angle;let delta=((target-base)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);let final=base+Math.PI*2*5+delta;let begin=performance.now(),duration=3300;function frame(now){let t=Math.min(1,(now-begin)/duration),ease=1-Math.pow(1-t,4);angle=base+(final-base)*ease;drawWheel(c,angle);if(t<1){requestAnimationFrame(frame)}else{angle=target;drawWheel(c,angle);spinning=false;showSecret=true;c.drawn.push(turnId);save();$('winner').textContent=ps[idx].name;$('result').classList.remove('hidden');$('spin').classList.add('hidden');$('result').scrollIntoView({behavior:'smooth',block:'nearest'})}}requestAnimationFrame(frame)}

function download(name,data,mime){let blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

async function editRoster(){let c=current();if(!c)return;if(c.assignments){toast('Die Auslosung läuft. Für Änderungen zuerst die Runde im Protokoll archivieren und beenden.');return}let raw=$('names').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(new Set(raw.map(n=>n.toLocaleLowerCase('de'))).size!==raw.length)return toast('Bitte gleiche Namen mit einem Zusatz unterscheiden.');if(raw.some(n=>n.length>90))return toast('Ein Name ist zu lang.');if($('joins').checked&&raw.some(n=>n.toLocaleLowerCase('de')===db.teacher.toLocaleLowerCase('de')))return toast('Die Lehrkraft steht bereits in der Schülerliste.');let existing=new Map(c.students.map(x=>[x.name,x]));let removed=c.students.filter(x=>!raw.includes(x.name));if(removed.length&&!await uiConfirm(`${removed.length} Schüler werden aus der aktuellen Liste entfernt. Archivierte Runden bleiben erhalten. Fortfahren?`))return;c.students=raw.map(name=>existing.get(name)||{id:uid(),name});c.teacherJoins=$('joins').checked;save();toast('Klassenliste aktualisiert');render()}

const bytesTo64=a=>btoa(Array.from(a,x=>String.fromCharCode(x)).join(''));
const b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const utf8=new TextEncoder();
function validBackup(v){return v&&typeof v.teacher==='string'&&Array.isArray(v.classes)&&v.classes.length<200&&v.classes.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.students)&&c.students.length<300&&Array.isArray(c.drawn)&&typeof c.teacherJoins==='boolean')}
async function derive(pass,salt){let key=await crypto.subtle.importKey('raw',utf8.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(data,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await derive(pass,salt);const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,utf8.encode(JSON.stringify(data)));return {format:'wichtelstube-encrypted',version:1,kdf:'PBKDF2-SHA256',iterations:310000,cipher:'AES-256-GCM',salt:bytesTo64(salt),iv:bytesTo64(iv),data:bytesTo64(new Uint8Array(ciphertext))}}
async function decryptData(v,pass){if(v?.format!=='wichtelstube-encrypted'||v.version!==1||v.iterations!==310000||v.cipher!=='AES-256-GCM')throw Error('Unbekanntes Sicherungsformat');let salt=b64ToBytes(v.salt),iv=b64ToBytes(v.iv);if(salt.length!==16||iv.length!==12)throw Error('Ungültige Datei');const key=await derive(pass,salt);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,b64ToBytes(v.data))))}
let lastExport=null;
async function exportBackup(){if(!globalThis.crypto?.subtle)return toast('Verschlüsselung ist in diesem Browser bei dieser Datei nicht verfügbar. Bitte die Datei in einem aktuellen Browser öffnen.');const pass=await uiPrompt('Passwort für die Sicherung (mindestens 6 Zeichen). Gut aufbewahren!');if(pass===null)return;if(pass.length<6)return toast('Bitte mindestens 6 Zeichen verwenden. Für echte Schülerdaten empfehlen wir eine längere Passphrase.');const again=await uiPrompt('Passwort zur Kontrolle erneut eingeben:');if(pass!==again)return toast('Passwörter stimmen nicht überein.');try{const encrypted=await encryptData(db,pass);lastExport=JSON.stringify(encrypted);download('Wichtelstube_verschluesselt.wichtel',lastExport,'application/octet-stream');changed=false;verifiedBackup=false;updateUnsaved();toast('Sicherung heruntergeladen. Bitte Datei sicher ablegen und vor dem Löschen mit „Sicherung prüfen“ kontrollieren. Ohne Passwort ist keine Wiederherstellung möglich.')}catch(e){toast('Sicherung fehlgeschlagen: '+e.message)}}
async function readSecureFile(f,pass){const obj=JSON.parse(await f.text());const v=await decryptData(obj,pass);if(!validBackup(v))throw Error('Ungültiger Dateninhalt');return v}
async function importBackup(input){const f=input.files?.[0];if(!f)return;input.value='';if(!globalThis.crypto?.subtle)return toast('Verschlüsselung in diesem Browser nicht verfügbar.');const pass=await uiPrompt('Passwort der Sicherungsdatei:');if(pass===null)return;try{const v=await readSecureFile(f,pass);if((db.teacher||db.classes.length)&&!await uiConfirm('Aktuelle Sitzung durch die geladene Sicherung ersetzen? Nicht exportierte Änderungen gehen verloren.'))return;db=v;activeId=null;changed=false;verifiedBackup=false;navTo('home');toast('Verschlüsselte Sicherung erfolgreich geöffnet.')}catch(e){toast('Sicherung konnte nicht geöffnet werden. Passwort oder Datei prüfen.')}}
async function verifyBackup(input){const f=input.files?.[0];if(!f)return;input.value='';const pass=await uiPrompt('Passwort zum Prüfen der heruntergeladenen Datei:');if(pass===null)return;try{const v=await readSecureFile(f,pass);if(JSON.stringify(v)!==JSON.stringify(db))return toast('Die Sicherung ist lesbar, stimmt aber nicht mit dem aktuellen Stand überein. Bitte erneut sichern.');verifiedBackup=true;toast('✓ Sicherung geprüft. Alle aktuellen Daten sind enthalten. Jetzt kann die Sitzung beendet werden.')}catch(e){toast('Prüfung fehlgeschlagen: '+e.message)}}
async function finishSession(){if(!verifiedBackup)return toast('Bitte zuerst die verschlüsselte Sicherung herunterladen und über „Sicherung prüfen“ wieder öffnen.');if(!await uiConfirm('Sitzung jetzt beenden? Die aktuellen Daten werden aus der Anwendung entfernt. Die heruntergeladene Sicherungsdatei bleibt erhalten.'))return;db=blank();activeId=null;turnId=null;showSecret=false;lastExport=null;verifiedBackup=false;changed=false;navTo('home');toast('Sitzung beendet. Die Wichtelstube hat die aktiven Daten verworfen. Bereits heruntergeladene Dateien oder Browser-/Systemkopien werden dadurch nicht gelöscht.')}
